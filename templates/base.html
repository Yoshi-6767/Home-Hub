<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Hub</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="layout">
        <!-- Левая панель с меню -->
        <aside class="sidebar">
            <div class="logo">
                Home Hub
            </div>
            
            <nav style="flex: 1;">
                <a href="/" class="nav-item">🏠 Главная</a>
                <a href="/shopping" class="nav-item">📋 Покупки</a>
                <a href="/wishes" class="nav-item">🎁 Желания</a>
                <a href="/calendar" class="nav-item">📅 Календарь</a>
                <a href="/notes" class="nav-item">📝 Заметки</a>
                <a href="/subscriptions" class="nav-item">💳 Подписки</a>
                <a href="/recipes" class="nav-item">🍳 Рецепты</a>
            </nav>
        </aside>

            <div style="margin-top: auto; border-top: 1px solid var(--border); padding-top: 16px;">
                <div style="display: flex; align-items: center; justify-content: space-between;">
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <div style="width: 32px; height: 32px; background: var(--accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold;">
                            {{ current_user.username[0]|upper }}
                        </div>
                        <div style="font-weight: 500; font-size: 14px;">{{ current_user.username }}</div>
                    </div>
                    <a href="/logout" class="btn-delete" title="Выйти" style="text-decoration: none;">Выйти</a>
                </div>
            </div>
        
        <!-- Основная рабочая область (сюда загружаются страницы) -->
        <main class="content">
            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
