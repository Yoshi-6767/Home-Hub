{% extends "base.html" %}

{% block content %}
<h1>Привет, {{ current_user.display_name }}!</h1>

<div class="cards">
    <a href="/shopping" class="card">
        <div class="card-icon"><i class="ph ph-shopping-cart"></i></div>
        <div class="card-title">Покупки</div>
        <div class="card-desc">Список покупок</div>
    </a>
    <a href="/wishes" class="card">
        <div class="card-icon"><i class="ph ph-gift"></i></div>
        <div class="card-title">Желания</div>
        <div class="card-desc">Что хотим</div>
    </a>
    <a href="/calendar" class="card">
        <div class="card-icon"><i class="ph ph-calendar"></i></div>
        <div class="card-title">Календарь</div>
        <div class="card-desc">События и даты</div>
    </a>
    <a href="/notes" class="card">
        <div class="card-icon"><i class="ph ph-note"></i></div>
        <div class="card-title">Заметки</div>
        <div class="card-desc">Твои записи</div>
    </a>
    <a href="/subscriptions" class="card">
        <div class="card-icon"><i class="ph ph-credit-card"></i></div>
        <div class="card-title">Подписки</div>
        <div class="card-desc">Твои платежи</div>
    </a>
    <a href="/recipes" class="card">
        <div class="card-icon"><i class="ph ph-cooking-pot"></i></div>
        <div class="card-title">Рецепты</div>
        <div class="card-desc">Свои рецепты</div>
    </a>
</div>
{% endblock %}
