{% extends "base.html" %}

{% block content %}
<h1 style="font-size: 28px; margin-bottom: 24px; color: var(--text);">Главная</h1>

<div class="cards">
    <a href="/friends" class="card">
        <i class="ph ph-users card-icon"></i>
        <div class="card-title">Друзья</div>
        <div class="card-desc">Твои контакты</div>
    </a>
    <a href="/chat" class="card">
        <i class="ph ph-chat-teardrop card-icon"></i>
        <div class="card-title">Чат</div>
        <div class="card-desc">Сообщения</div>
    </a>
    <a href="/library" class="card">
        <i class="ph ph-books card-icon"></i>
        <div class="card-title">Библиотека</div>
        <div class="card-desc">Фильмы, книги, аниме</div>
    </a>
    <a href="/shopping" class="card">
        <i class="ph ph-shopping-cart card-icon"></i>
        <div class="card-title">Покупки</div>
        <div class="card-desc">Списки продуктов</div>
    </a>
    <a href="/wishes" class="card">
        <i class="ph ph-gift card-icon"></i>
        <div class="card-title">Желания</div>
        <div class="card-desc">Что хочешь купить</div>
    </a>
    <a href="/calendar" class="card">
        <i class="ph ph-calendar card-icon"></i>
        <div class="card-title">Календарь</div>
        <div class="card-desc">События и даты</div>
    </a>
    <a href="/notes" class="card">
        <i class="ph ph-note card-icon"></i>
        <div class="card-title">Заметки</div>
        <div class="card-desc">Твои записи</div>
    </a>
    <a href="/subscriptions" class="card">
        <i class="ph ph-credit-card card-icon"></i>
        <div class="card-title">Подписки</div>
        <div class="card-desc">Платежи</div>
    </a>
    <a href="/recipes" class="card">
        <i class="ph ph-cooking-pot card-icon"></i>
        <div class="card-title">Рецепты</div>
        <div class="card-desc">Кулинарная книга</div>
    </a>
</div>
{% endblock %}
